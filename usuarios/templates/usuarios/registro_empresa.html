{% extends 'usuarios/base_auth.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="max-w-4xl mx-auto p-6 bg-white rounded-lg shadow-md">
    <h2 class="text-2xl font-bold mb-6 text-center">Registro de Empresa</h2>
    
    <form method="post" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Datos de Usuario -->
            <div class="border p-4 rounded-lg">
                <h3 class="text-lg font-semibold mb-3">Datos de Acceso</h3>
                {{ user_form|crispy }}
            </div>
            
            <!-- Datos de Empresa -->
            <div class="border p-4 rounded-lg">
                <h3 class="text-lg font-semibold mb-3">Información Legal</h3>
                {{ empresa_form|crispy }}
            </div>
        </div>
        
        <!-- Perfil de Proveedor -->
        <div class="border p-4 rounded-lg mt-4">
            <h3 class="text-lg font-semibold mb-3">Preferencias de Licitaciones</h3>
            {{ perfil_form|crispy }}
        </div>
        
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 px-4 rounded-lg transition duration-300">
            Registrar Empresa
        </button>
    </form>
</div>
{% endblock %}
