{% extends 'usuarios/base_auth.html' %}
{% load crispy_forms_tags %}

{% block content %}
<h2 class="text-2xl font-bold mb-6 text-center text-gray-800">
    <i class="fas fa-sign-in-alt mr-2"></i>Iniciar Sesión
</h2>
<form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-md transition duration-300">
        Ingresar
    </button>
</form>
<div class="mt-4 text-center">
    <a href="{% url 'register' %}" class="text-blue-600 hover:text-blue-800">¿No tienes cuenta? Regístrate</a>
</div>
{% endblock %}
