{% extends 'usuarios/base_auth.html' %}

{% block content %}
<div class="text-center">
    <h1 class="text-2xl font-bold mb-4">
        <i class="fas fa-user mr-2"></i>Bienvenido
    </h1>
    
    <div class="bg-white p-6 rounded-lg shadow-lg max-w-md mx-auto">
        <p class="text-lg mb-4">Estás conectado como:</p>
        <p class="text-xl font-semibold text-blue-600">
            {% if user.first_name or user.last_name %}
                {{ user.first_name }} {{ user.last_name }}
            {% else %}
                {{ user.username }}
            {% endif %}
        </p>
        <p class="text-gray-600 mt-2">{{ user.email }}</p>
        
        <div class="mt-6">
            <a href="{% url 'logout' %}" 
               class="bg-red-500 hover:bg-red-600 text-white py-2 px-4 rounded-lg transition duration-300">
                Cerrar sesión
            </a>
        </div>
    </div>
</div>
{% endblock %}
