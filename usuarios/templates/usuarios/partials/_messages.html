{% if messages %}
<div class="mb-4">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }} px-4 py-3 rounded relative mb-2
        {% if message.tags == 'success' %}bg-green-100 text-green-700 border border-green-400
        {% elif message.tags == 'error' %}bg-red-100 text-red-700 border border-red-400
        {% else %}bg-blue-100 text-blue-700 border border-blue-400{% endif %}">
        {{ message }}
        <button type="button" class="absolute top-0 bottom-0 right-0 px-4 py-3" onclick="this.parentElement.remove()">
            <i class="fas fa-times"></i>
        </button>
    </div>
    {% endfor %}
</div>
{% endif %}
